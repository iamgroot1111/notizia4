name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [ pwa-ui ]          # <— nur dieser Branch deployed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}  # gegen gleichzeitige Läufe
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # WICHTIG: Genau EIN Upload-Schritt und zwar der pages-spezifische:
      - name: Upload dist to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist              # Ordner aus Vite-Build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
